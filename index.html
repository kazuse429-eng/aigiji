<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{-webkit-text-size-adjust:100%;background:var(--bg)}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI議事録">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1220" media="(prefers-color-scheme: dark)">
<title>AI議事録</title>
</head>
<body>
<style>
/* 画面: 下のナビ（記録・ToDo・振り返り・設定）＋中央の録音ボタン。記録の詳細は 要約｜文字起こし｜ToDo｜AIに質問 のタブ */
:root{
  --bg:#f4f5f9; --surface:#ffffff; --fg:#161b2e; --muted:#5b6378; --line:#d9dde8;
  --accent:#3949ab; --accent-soft:#e7e9f7; --accent-fg:#ffffff;
  --rec:#d23b3b; --rec-soft:#fbe7e7; --ok:#1c7a4c; --ok-soft:#e2f3ea; --warn:#8a5a00; --warn-soft:#fbf1dc;
  --font-body:"BIZ UDPGothic","Yu Gothic UI","Hiragino Sans","Meiryo",system-ui,sans-serif;
  --font-num:"BIZ UDGothic","Consolas","Menlo",monospace;
  --shadow:0 1px 2px rgba(22,27,46,.06),0 3px 10px rgba(22,27,46,.06);
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#181c2e; --fg:#e4e7f2; --muted:#9aa1b8; --line:#2b3150;
  --accent:#8f9cf0; --accent-soft:#232a4d; --accent-fg:#0d1030;
  --rec:#f07373; --rec-soft:#3b1d22; --ok:#5cc58f; --ok-soft:#173226; --warn:#e0b050; --warn-soft:#352a12; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#181c2e; --fg:#e4e7f2; --muted:#9aa1b8; --line:#2b3150;
  --accent:#8f9cf0; --accent-soft:#232a4d; --accent-fg:#0d1030;
  --rec:#f07373; --rec-soft:#3b1d22; --ok:#5cc58f; --ok-soft:#173226; --warn:#e0b050; --warn-soft:#352a12; color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 3px 10px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.7;margin:0}
.wrap{max-width:780px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-right,0px) + 16px) calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 40px) calc(env(safe-area-inset-left,0px) + 16px)}
h1{font-size:1.45rem;margin:0;line-height:1.3}
h2{font-size:1.1rem;margin:22px 0 8px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.86rem}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--rec)} .btn.sm{padding:3px 11px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.rec{background:var(--rec-soft);color:var(--rec)}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.9rem;margin:10px 0}
.empty{text-align:center;color:var(--muted);padding:48px 12px}

/* ヘッダー */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;fill:var(--accent-fg)}
.back{border:none;background:none;text-decoration:none;font-size:1.4rem;line-height:1;padding:4px 8px 4px 0;color:var(--accent)}

/* 記録一覧 */
.search{width:100%;margin-bottom:6px}
.day{font-size:.88rem;color:var(--muted);margin:18px 0 6px;font-weight:700}
.rec-item{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.rec-item:hover{border-color:var(--accent)}
.rec-item .t{font-weight:700;overflow-wrap:anywhere}
.rec-item .m{font-size:.84rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.rec-item .p{font-size:.88rem;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* 下のナビ */
nav.bar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;z-index:20}
nav.bar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.74rem;color:var(--muted);gap:2px}
nav.bar button svg{width:22px;height:22px;fill:currentColor}
nav.bar button.on{color:var(--accent);font-weight:700}
.fab{position:relative;top:-18px;width:66px;height:66px;margin:0 auto;border-radius:50%!important;background:var(--rec)!important;color:#fff!important;box-shadow:0 4px 14px rgba(210,59,59,.4)}
.fab svg{width:28px!important;height:28px!important}

/* 詳細のタブ */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 14px;overflow-x:auto}
.tabs button{border:none;background:none;padding:8px 12px;border-bottom:3px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.title-in{width:100%;font-size:1.25rem;font-weight:700;border:1px solid transparent;background:none;padding:2px 6px;margin-left:-6px}
.title-in:hover,.title-in:focus{border-color:var(--line);background:var(--surface)}

/* 要約 */
.sec{margin-bottom:14px}
.sec h3{font-size:1rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:4px;height:1em;background:var(--accent);border-radius:2px}
.sec ul{margin:0;padding-left:1.3em}
.sec li{margin:2px 0}
.tpl-pick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tpl-pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:.86rem}
.tpl-pick button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.kw{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* 文字起こし */
.seg{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.seg .tm{font-family:var(--font-num);font-size:.8rem;color:var(--muted);border:none;background:none;padding:0;text-align:left}
.seg .tm:hover{color:var(--accent)}
.spk{border:none;border-radius:999px;padding:0 10px;font-size:.8rem;font-weight:700;justify-self:start}
.seg .tx{grid-column:1/-1;overflow-wrap:anywhere}
.seg.playing{background:var(--accent-soft)}
.spk-legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.player{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5;display:flex;gap:8px;align-items:center}

/* ToDo */
.todo{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--accent)}
.todo .what{overflow-wrap:anywhere}
.todo.done .what{text-decoration:line-through;color:var(--muted)}
.todo .meta{grid-column:2/-1;font-size:.84rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.todo .meta .late{color:var(--rec);font-weight:700}
.todo .edit{border:none;background:none;color:var(--muted);font-size:.84rem}

/* AIに質問 */
.qa{margin-bottom:12px}
.qa .q{font-weight:700}
.qa .a{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:4px}
.ask{display:flex;gap:8px;margin-top:8px}
.ask textarea{flex:1;min-height:44px}

/* 録音画面 */
.recview{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.recview .in{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.clock{font-family:var(--font-num);font-size:2.6rem;text-align:center;letter-spacing:.04em;margin:6px 0 0}
.state{text-align:center;color:var(--muted);font-size:.9rem;min-height:1.6em}
.state .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.level{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px auto 12px;width:min(320px,80%)}
.level i{display:block;height:100%;width:0;background:var(--rec);transition:width .1s}
.live{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.live p{margin:0 0 6px;overflow-wrap:anywhere}
.live .interim{color:var(--muted)}
.rec-ctl{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:14px}
.rbtn{width:64px;height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.rbtn svg{width:26px;height:26px;fill:var(--fg)}
.rbtn.stop{width:76px;height:76px;background:var(--rec);border-color:var(--rec)}
.rbtn.stop svg{fill:#fff}
.rec-opts{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}

/* 進行中の処理 */
.busy{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;margin:8px 0}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px);text-align:center}

/* 設定 */
.field{margin:14px 0}
.field label{display:block;font-weight:700;margin-bottom:4px}
.field .hint{font-size:.85rem;color:var(--muted);margin-top:4px}
.switch{display:flex;gap:10px;align-items:flex-start}
.switch input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}

/* ダイアログ */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(560px,100%);border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:85vh;overflow-y:auto}
@media (min-width:640px){.sheet-bg{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0 0 10px}

@media (max-width:520px){
  h1{font-size:1.25rem} .clock{font-size:2.2rem}
  .tabs button{padding:8px 9px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{
  nav.bar,.no-print,.tabs,.player,.tpl-pick,.ask,.back{display:none!important}
  body{background:#fff;color:#000} .card{box-shadow:none;border:none;padding:0}
  .wrap{padding:0;max-width:none}
}
</style>

<div class="wrap" id="main"></div>
<nav class="bar" id="nav" aria-label="メニュー">
  <button data-go="home"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>記録</button>
  <button data-go="todo"><svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>ToDo</button>
  <button class="fab" id="fab" aria-label="録音を始める"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg></button>
  <button data-go="daily"><svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14zM7 11h5v5H7z"/></svg>振り返り</button>
  <button data-go="settings"><svg viewBox="0 0 24 24"><path d="M3 6h9v2H3zm13 0h5v2h-5zm-3-2h2v6h-2zM3 16h3v2H3zm7 0h11v2H10zm-3-2h2v6H7z"/></svg>設定</button>
</nav>
<div id="overlay"></div>

<script>
// 端末内ルール（AIキーが無いとき・社外秘モードのとき）と、要約テンプレートの定義。
// AIを使わず、言い回しで決定事項・ToDo・課題を拾う。node でも読める（test_rules.mjs が検査する）。
(function (root) {
"use strict";

// 要約テンプレート。role はルール抽出でどの文を入れるか（AI要約では見出しだけ使う）
const TEMPLATES = [
  {id: "standard", name: "標準", desc: "どんな会話にも", sections: [["概要", "overview"], ["要点", "point"], ["ToDo", "todo"]]},
  {id: "meeting", name: "会議", desc: "定例・社内会議", sections: [["概要", "overview"], ["決定事項", "decision"], ["議論のポイント", "point"], ["次回までの課題", "todo"]]},
  {id: "tech", name: "技術打合せ", desc: "仕様・設計・現場の打合せ", sections: [["概要", "overview"], ["仕様・条件", "point"], ["決定事項", "decision"], ["未決・確認事項", "issue"], ["宿題", "todo"]]},
  {id: "sales", name: "商談", desc: "お客様との打合せ", sections: [["概要", "overview"], ["先方の要望・課題", "issue"], ["提案・説明した内容", "point"], ["合意事項", "decision"], ["次のアクション", "todo"]]},
  {id: "oneonone", name: "1on1・面談", desc: "面談・相談", sections: [["概要", "overview"], ["話したこと", "point"], ["悩み・気づき", "issue"], ["合意したこと", "decision"], ["フォローアップ", "todo"]]},
  {id: "lecture", name: "講義・セミナー", desc: "聞いた内容の整理", sections: [["概要", "overview"], ["主なトピック", "topic"], ["重要なポイント", "point"], ["用語・キーワード", "keyword"], ["疑問点", "issue"]]},
  {id: "idea", name: "アイデアメモ", desc: "ひとり言・思いつき", sections: [["概要", "overview"], ["アイデア", "point"], ["次に試すこと", "todo"]]},
];

const RE_DECISION = /決定|決まり|決めま|決めよう|ことにしま|ことにしよう|ことになりま|ことになった|で行きましょう|でいきましょう|で進めま|で進めよう|で進める|合意|確定|承認|了承|それでいきま|それで行きま|採用/;
const RE_TODO = /お願いします|お願いできますか|お願いできれば|お願いしたい|頼みます|やっておきます|やっておいて|しておきます|しておいて|しといて|対応します|対応しておきます|確認します|確認しておきます|確認してもらえ|送ります|送っておきます|送付します|手配します|準備します|作成します|作っておきます|作ります|調べます|調べておきます|まとめます|まとめておきます|連絡します|連絡しておきます|共有します|提出します|見積もります|見積します|検討します|検討しておきます|までに/;
const RE_ISSUE = /課題|問題|懸念|リスク|困って|困る|未定|決まってない|決まっていない|わからない|分からない|不明|要確認|確認が必要|気になる|心配|厳しい|足りない|間に合わない|[？?]$/;
const RE_QUESTION = /(ですか|ますか|でしょうか|いいか|どうか)[。？?]?$|[？?]$/;
const RE_FILLER = /^(えー|えっと|あの|その|まあ|うーん|はい|ええ|うん|そうですね|なるほど)[、。\s]*$/;
const RE_KW = /打ち?合わ?せ|[一-龥々]{2,}|[ァ-ヶー]{3,}|[A-Za-z][A-Za-z0-9\-]{1,}/g;
const RE_NOT_KW = /^(来週|今週|再来週|来月|今月|先週|先月|毎週|毎月|一度|もう一度)|確認$|^(メートル|ミリ|センチ|キロ|グラム|パーセント)$|^打ち?合わ?せ$/;
const STOP = new Set(("今日 明日 昨日 今回 前回 次回 確認 大丈夫 感じ 方向 部分 場合 必要 予定 対応 自分 一応 結構 本当 全部 最初 最後 意味 状況 関係 問題 時間 今後 以上 以下 程度 相手 一緒 普通 多分 全然 基本 大体 一番 何回 ところ 皆さん お願い 検討 準備 連絡 共有 作成 決定 合意 課題 来週 今週 今月 来月 月末 毎日 先日 午前 午後 本日 当日 一旦 実際 了解 承知 失礼 ちょっと 気持 時点 段階 タイミング イメージ パターン ポイント スケジュール").split(" "));
const WD = "日月火水木金土";

function pad(n) { return String(n).padStart(2, "0"); }
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function addDays(d, n) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function dueLabel(s) { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ""); if (!m) return s || ""; const d = new Date(+m[1], m[2] - 1, +m[3]); return `${+m[2]}/${+m[3]}(${WD[d.getDay()]})`; }
function day0(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

// 文字起こしの文に分ける（句点・疑問符・改行）
function sentences(text) {
  return String(text || "").split(/(?<=[。！？!?])|\n+/).map(s => s.trim()).filter(s => s && !RE_FILLER.test(s));
}

// 期限の言い回し → {label: 原文, iso: "YYYY-MM-DD" か ""}。base は録音日
function parseDue(text, base) {
  base = day0(base || new Date());
  const t = String(text || "");
  let m;
  const ymd = (mo, d) => {   // 月日だけのときは、録音日より2か月以上前なら翌年とみなす
    let y = base.getFullYear(), x = new Date(y, mo - 1, d);
    if (x < addDays(base, -60)) x = new Date(y + 1, mo - 1, d);
    return x;
  };
  if ((m = t.match(/(\d{4})[年\/\-](\d{1,2})[月\/\-](\d{1,2})日?/))) return {label: m[0], iso: iso(new Date(+m[1], m[2] - 1, +m[3]))};
  if ((m = t.match(/(\d{1,2})月(\d{1,2})日/))) return {label: m[0], iso: iso(ymd(+m[1], +m[2]))};

  if ((m = t.match(/明後日|あさって/))) return {label: m[0], iso: iso(addDays(base, 2))};
  if ((m = t.match(/明日|あした/))) return {label: m[0], iso: iso(addDays(base, 1))};
  if ((m = t.match(/今日中|本日中|今日まで|本日まで/))) return {label: m[0], iso: iso(base)};
  if ((m = t.match(/(来週|今週|再来週)の?([日月火水木金土])曜/))) {

    const mon = addDays(base, -((base.getDay() + 6) % 7));       // その週の月曜
    return {label: m[0], iso: iso(addDays(mon, wk * 7 + (WD.indexOf(m[2]) + 6) % 7))};
  }
  if ((m = t.match(/(今週|来週|再来週)(中|いっぱい|末|まで)/))) {
    const wk = {"今週": 0, "来週": 1, "再来週": 2}[m[1]];
    const mon = addDays(base, -((base.getDay() + 6) % 7));
    return {label: m[0], iso: iso(addDays(mon, wk * 7 + 4))};   // 金曜
  }
  if ((m = t.match(/([日月火水木金土])曜日?(まで|中|に)/))) {
    let n = (WD.indexOf(m[1]) - base.getDay() + 7) % 7; if (n === 0) n = 7;
    return {label: m[0], iso: iso(addDays(base, n))};
  }
  if ((m = t.match(/来月(中|末|いっぱい)/))) return {label: m[0], iso: iso(new Date(base.getFullYear(), base.getMonth() + 2, 0))};
  if ((m = t.match(/今月(中|末|いっぱい)|月末/))) return {label: m[0], iso: iso(new Date(base.getFullYear(), base.getMonth() + 1, 0))};

// 担当者: 「〇〇さんに/が」→ 〇〇さん。「私が・こちらで」→ 話者。わからなければ空
function parseWho(text, speaker) {

  if (m && !/^(皆|みな|お客|先方|相手|担当)$/.test(m[1])) return m[1] + (m[2] === "君" ? "くん" : m[2]);
  if (/(先方|お客様|お客さん)(に|が|で|から)/.test(t) && !/(先方|お客様|お客さん)に/.test(t)) return "先方";
  if (/(私|僕|ぼく|わたし|自分|俺|こちら|弊社|うち)(が|で|の方で|から|も)/.test(t) || /(やっておきます|しておきます|対応します|確認します|送ります|手配します|準備します|作成します|調べます|まとめます|連絡します|共有します|提出します|作ります|検討します)/.test(t)) return speaker || "";
  return "";
}

// よく出る言葉（固有の話題を表す）
function keywords(text, n) {

  for (const w of String(text || "").match(RE_KW) || []) {
    if (STOP.has(w) || w.length > 12 || RE_NOT_KW.test(w)) continue;
    cnt.set(w, (cnt.get(w) || 0) + 1);
  }
  return [...cnt.entries()].filter(([w, c]) => c >= 2 || w.length >= 4)
    .sort((a, b) => b[1] - a[1] || b[0].length - a[0].length).slice(0, n || 8).map(e => e[0]);
}

function trimSentence(s, max) { s = s.replace(/^(それでは|それで|じゃあ|では|えー|えっと|あの|まあ|で)[、,\s]+/, ""); return s.length > (max || 90) ? s.slice(0, max || 90) + "…" : s; }

// 文字起こし → 要約。segs: [{t, text, spk}]、speakers: {"1": "表示名"}、template: TEMPLATES の id
function summarize(segs, templateId, base, speakers) {
  const tpl = TEMPLATES.find(t => t.id === templateId) || TEMPLATES[0];
  const name = k => (speakers && speakers[k]) || (k ? "Speaker " + k : "");
  const sents = [];
  for (const s of segs || []) for (const x of sentences(s.text)) sents.push({text: x, spk: s.spk, t: s.t});
  const all = sents.map(s => s.text).join("");
  const kws = keywords(all, 10);
  const used = new Set();
  const decisions = sents.filter(s => RE_DECISION.test(s.text) && s.text.length >= 6 && !RE_QUESTION.test(s.text));
  decisions.forEach(s => used.add(s));
  const todos = [];
  for (const s of sents) {
    if (!RE_TODO.test(s.text) || s.text.length < 6) continue;
    const due = parseDue(s.text, base);
    todos.push({who: parseWho(s.text, name(s.spk)), due: due.iso || due.label, what: trimSentence(s.text, 80), t: s.t});
    used.add(s);
  }
  const issues = sents.filter(s => !used.has(s) && RE_ISSUE.test(s.text) && s.text.length >= 8);
  issues.forEach(s => used.add(s));
  const score = s => kws.reduce((a, k, i) => a + (s.text.includes(k) ? (10 - i) : 0), 0);
  const points = sents.filter(s => !used.has(s) && s.text.length >= 12)
    .map(s => ({s, v: score(s)})).filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v).slice(0, 6).map(x => x.s).sort((a, b) => a.t - b.t);
  const firstReal = sents.filter(s => s.text.length >= 10).slice(0, 2).map(s => trimSentence(s.text, 70));
  const overview = [];
  if (!sents.length) overview.push("文字起こしがありません（無音か、音声認識が使えなかった可能性があります）");
  if (kws.length) overview.push("主な話題: " + kws.slice(0, 5).join("、"));
  if (firstReal.length) overview.push("冒頭: " + firstReal.join(" / "));
  if (sents.length) overview.push(`決定事項 ${decisions.length}件・ToDo ${todos.length}件・課題 ${issues.length}件を言い回しから抽出（端末内ルール）`);
  const byRole = {
    overview: overview,
    decision: decisions.map(s => trimSentence(s.text)),
    point: points.map(s => trimSentence(s.text)),
    issue: issues.slice(0, 8).map(s => trimSentence(s.text)),
    todo: todos.map(t => [t.who && t.who + "：", t.what, t.due && `（期限 ${dueLabel(t.due)}）`].filter(Boolean).join("")),
    topic: kws.slice(0, 6),
    keyword: kws,
  };
  return {
    title: kws.length ? kws.slice(0, 3).join("・") : "",
    sections: tpl.sections.map(([h, role]) => ({heading: h, items: byRole[role] || []})),
    todos: todos.map(({who, due, what}) => ({who, due, what})),
    keywords: kws,
  };
}

// 質問への簡易回答（AIなし）: 質問の言葉を含む発言を時刻つきで返す
function search(segs, q, n) {
  const words = (String(q).match(RE_KW) || []).filter(w => !STOP.has(w));
  const ws = words.length ? words : String(q).replace(/[？?。、\s]/g, "").match(/.{2}/g) || [];
  return (segs || []).map(s => ({s, v: ws.reduce((a, w) => a + (s.text.includes(w) ? w.length : 0), 0)}))
    .filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, n || 6).map(x => x.s).sort((a, b) => a.t - b.t);
}

const api = {TEMPLATES, sentences, parseDue, parseWho, keywords, summarize, search, iso, dueLabel};
if (typeof module !== "undefined" && module.exports) module.exports = api;

const tpmLimit = () => settings.tpm || 7000;   // 無料枠 8,000/分 に余裕を持たせる（settings.tpm は検証用）

// AIが出したToDoで置き換える。手で足した・直したものと、完了済みのものは残す

    const what = String(t.what), prev = old.find(o => !o.manual && o.what === what);
    return {id: prev ? prev.id : uid(), who: String(t.who || ""), due: String(t.due || ""), what, done: prev ? prev.done : false};

  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });

}

// ルーター: #/ 記録一覧, #/r/<id>/<tab>, #/todo, #/daily/<日付>, #/settings, #/ask

// 文字起こし
const Player = {
  audio: null, rec: null, chunks: [], ci: -1,
  async play(rec, t) {
    if (!this.audio) { this.audio = new Audio(); this.audio.ontimeupdate = () => this.mark(); this.audio.onended = () => this.next(); }
    if (this.rec !== rec) { this.rec = rec; this.chunks = (await DB.chunks(rec.id)).filter(c => c.blob && c.blob.size); }
    if (!this.chunks.length) { toast("音声が保存されていません"); return; }
    let i = this.chunks.findIndex(c => t >= c.t0 && t < c.t1); if (i < 0) i = this.chunks.findIndex(c => c.t0 >= t); if (i < 0) i = 0;
    this.load(i, Math.max(0, t - this.chunks[i].t0));
  },
  load(i, off) {
    this.ci = i; const a = this.audio;

    a.src = URL.createObjectURL(this.chunks[i].blob);
    a.onloadedmetadata = () => { try { if (off > 0.3) a.currentTime = off; } catch (e) {} };
    a.play().catch(() => {}); this.ui();
  },
  next() { if (this.ci + 1 < this.chunks.length) this.load(this.ci + 1, 0); else { this.ci = -1; this.ui(); } },
  toggle() { if (!this.audio) return; if (this.audio.paused) this.audio.play(); else this.audio.pause(); this.ui(); },
  now() { return this.ci < 0 ? -1 : this.chunks[this.ci].t0 + (this.audio.currentTime || 0); },

    if (cur) cur.classList.add("playing");
  },
  ui() { const b = $("#pl-btn"); if (b) b.textContent = this.audio && !this.audio.paused && this.ci >= 0 ? "一時停止" : "再生"; },
};
function tabTranscript(el, rec) {

const DAILY_HEADS = ["今日のハイライト", "話した話題", "決まったこと", "やること"];
async function makeDaily(date, list) {
  if (aiOn()) {
    let ctx = "";
    for (const r of list) {
      const s = `■${fmtClock(r.created)}「${r.title}」(${fmtTime(r.dur)}) ` + (r.summary ? r.summary.sections.map(x => x.heading + ": " + x.items.join(" / ")).join(" ｜ ") : recText(r).slice(0, 400))
        + (r.todos.length ? " ｜ ToDo: " + r.todos.map(t => (t.who ? t.who + ":" : "") + t.what + (t.due ? "(" + t.due + ")" : "")).join(" / ") : "") + "\n";
      if ((ctx + s).length > 4000) break; ctx += s;
    }
    const j = await chatJSON(SYS, `${date} の1日分の記録から、本人向けの振り返りを作ってください。
見出しは ${DAILY_HEADS.join(" / ")} の順。次のJSONで: {"sections":[{"heading":"見出し","items":["短い文"]}]}
「今日のハイライト」は2〜3個。「やること」は担当と期限があれば添えます。

${ctx}`, 2000, "振り返り");
    const secs = Array.isArray(j.sections) ? j.sections : [];
    return {date, by: "ai", at: Date.now(), sections: DAILY_HEADS.map(h => { const s = secs.find(x => x && x.heading === h) || {}; return {heading: h, items: (Array.isArray(s.items) ? s.items : []).map(String)}; })};
  }
  const pick = re => list.flatMap(r => (r.summary ? r.summary.sections : []).filter(s => re.test(s.heading)).flatMap(s => s.items));
  return {date, by: "rule", at: Date.now(), sections: [
    {heading: DAILY_HEADS[0], items: list.map(r => `${fmtClock(r.created)} ${r.title}（${fmtTime(r.dur)}）`)},
    {heading: DAILY_HEADS[1], items: [...new Set(list.flatMap(r => r.summary ? r.summary.keywords : R.keywords(recText(r), 5)))].slice(0, 10)},
    {heading: DAILY_HEADS[2], items: pick(/決定|合意/)},
    {heading: DAILY_HEADS[3], items: list.flatMap(r => r.todos.filter(t => !t.done).map(t => (t.who ? t.who + "：" : "") + t.what + (t.due ? `（${fmtDue(t.due)}）` : "")))},
  ]};
}

function transcriptText(rec) { return rec.segs.map(s => `[${fmtTime(s.t)}] ${s.spk ? spkName(rec, s.spk) + ": " : ""}${s.text}`).join("\n"); }
function markdown(rec, withTranscript) {
  const L = [`# ${rec.title}`, "", `- 日時: ${R.iso(new Date(rec.created))}（${WDAY[new Date(rec.created).getDay()]}） ${fmtClock(rec.created)}`, `- 長さ: ${fmtTime(rec.dur)}`];
  const ks = [...new Set(rec.segs.map(s => s.spk).filter(Boolean))];
  if (ks.length) L.push(`- 話者: ${ks.map(k => spkName(rec, k)).join("、")}`);
  if (rec.summary) for (const s of rec.summary.sections) { L.push("", `## ${s.heading}`); L.push(...(s.items.length ? s.items.map(i => `- ${i}`) : ["- （該当なし）"])); }
  if (rec.todos.length) { L.push("", "## ToDo"); for (const t of rec.todos) L.push(`- [${t.done ? "x" : " "}] ${t.who ? t.who + "：" : ""}${t.what}${t.due ? `（期限 ${fmtDue(t.due)}）` : ""}`); }
  if (withTranscript && rec.segs.length) L.push("", "## 文字起こし", "", transcriptText(rec));
  return L.join("\n") + "\n";
}

function copy(text) {
  const done = () => toast("コピーしました");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("コピーできませんでした"); } t.remove(); }
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: (type || "text/plain") + ";charset=utf-8"}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---------- 起動 ----------
$("#fab").onclick = async () => {
  if (Recorder.active) { openRecView(); return; }
  openRecView();
  $("#rv-state").textContent = "マイクを準備中…";
  if (!(await Recorder.start())) { $("#overlay").innerHTML = ""; return; }
  drawRecView(); drawLive(); render();
};
$$("#nav button[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go === "home" ? "#/" : "#/" + b.dataset.go; });
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
window.addEventListener("online", () => { for (const r of recs.values()) if (r.state === "proc" || r.err) Pipeline.kick(r.id); });
window.addEventListener("beforeunload", e => { if (Recorder.active) { e.preventDefault(); e.returnValue = ""; } });
(async function boot() {
  loadSettings(); applyTheme();
  await DB.open();
  for (const r of await DB.all("records")) {
    if (r.state === "rec") r.state = "proc";   // 録音中に閉じた記録は、保存できた分から続ける
    r.stage = ""; recs.set(r.id, r);
  }
  render();
  for (const r of recs.values()) if (r.state === "proc") Pipeline.kick(r.id);
})();
window.__aigiji = {DB, recs, settings: () => settings, save, Pipeline, Recorder, render, ruleSummary, markdown};   // UIテスト用
